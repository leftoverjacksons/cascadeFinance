name: CI

on:
  push:
    branches-ignore: [main] # main is covered by deploy.yml, which calls this workflow
  pull_request:
  workflow_call:

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Database and end-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies all migrations)
        run: npm run db:start
      - name: Run pgTAP tests
        run: npm run db:test
      - name: Check generated types are up to date
        run: |
          npm run -s db:types
          git diff --exit-code src/lib/database.types.ts
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (phone and desktop)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
